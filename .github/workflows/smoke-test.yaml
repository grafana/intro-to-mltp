name: Stack smoke test

on:
  # Run on every PR so this job can be required without path-filtered checks
  # remaining pending on documentation-only changes.
  pull_request:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "docker-compose*.yml"
      - "alloy/**"
      - "grafana/**"
      - "loki/**"
      - "mimir/**"
      - "tempo/**"
      - "tests/**"
      - ".github/workflows/smoke-test.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/tests/artifacts/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Test smoke assertions and runner
        run: node --test tests/smoke/*.test.mjs

      - name: Build and test the local stack
        shell: bash
        run: |
          mkdir -p "$SMOKE_ARTIFACT_DIR"
          node tests/smoke/run.mjs 2>&1 | tee "$SMOKE_ARTIFACT_DIR/run.log"

      - name: Upload stack diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-diagnostics
          path: ${{ env.SMOKE_ARTIFACT_DIR }}
          if-no-files-found: warn
          retention-days: 7
